<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佛堂即時互動簡報導航大廳</title>
  <meta name="description" content="互動式多媒體課件簡報導航入口">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #ffb74d;     /* 溫暖金黃 */
      --secondary: #81c784;   /* 翡翠綠 */
      --bg-dark: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(255, 183, 77, 0.05) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(129, 199, 132, 0.05) 0px, transparent 50%);
      color: #f5f6f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }
    
    header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    header span {
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 12px;
      animation: pulse 2.5s infinite ease-in-out;
    }
    
    header h1 {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      font-weight: 900;
      font-size: 2.5rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }
    
    header p {
      color: #8892b0;
      font-size: 1rem;
      max-width: 600px;
      line-height: 1.6;
    }
    
    .dashboard-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 960px;
      margin-bottom: 50px;
    }
    
    .deck-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      position: relative;
      overflow: hidden;
    }
    
    .deck-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    
    .deck-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 183, 77, 0.3);
      box-shadow: 0 20px 40px rgba(255, 183, 77, 0.08);
    }
    
    .deck-card:hover::before {
      opacity: 1;
    }
    
    .deck-card .icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: rgba(255, 183, 77, 0.1);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 25px;
      transition: all 0.3s ease;
    }
    
    .deck-card:nth-child(2) .icon-wrapper {
      background: rgba(129, 199, 132, 0.1);
      color: var(--secondary);
    }
    
    .deck-card:hover .icon-wrapper {
      transform: scale(1.1);
    }
    
    .deck-card h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    
    .deck-card p {
      color: #8892b0;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 30px;
      flex-grow: 1;
    }
    
    .enter-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    
    .deck-card:hover .enter-btn {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      box-shadow: 0 5px 15px rgba(255, 183, 77, 0.2);
    }
    
    .deck-card:nth-child(2):hover .enter-btn {
      background: var(--secondary);
      color: #090d16;
      border-color: var(--secondary);
      box-shadow: 0 5px 15px rgba(129, 199, 132, 0.2);
    }
    
    footer {
      text-align: center;
      color: #555;
      font-size: 0.8rem;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; text-shadow: 0 0 10px var(--primary); }
      100% { transform: scale(1); opacity: 0.9; }
    }
  </style>
</head>
<body>

  <header>
    <span>智慧課堂 • 即時互動</span>
    <h1>多媒體簡報導航大廳</h1>
    <p>點選下方課件卡片即可進入 Reveal.js 線上簡報。簡報中配有 AI 視覺背景、即時文字雲與問卷投票，提供極致的授課與學習體驗。</p>
  </header>

  <div class="dashboard-container">
    
    <!-- 卡片1：孝悌忠信 -->
    <div class="deck-card">
      <div>
        <div class="icon-wrapper">
          <i class="fa-solid fa-compass"></i>
        </div>
        <h3>孝悌忠信互動簡報</h3>
        <p>以現代禪學與心理學視角重新詮釋傳統德育。內含學員情緒字詞雲、行孝痛點投票以及悌道「猜忌與寬恕」心境對比滑桿。</p>
      </div>
      <a href="filial-piety/" class="enter-btn">
        開始放映 <i class="fa-solid fa-chevron-right"></i>
      </a>
    </div>
    
    <!-- 卡片2：五戒 -->
    <div class="deck-card">
      <div>
        <div class="icon-wrapper">
          <i class="fa-solid fa-dharmachakra"></i>
        </div>
        <h3>五戒之真義與現代心法</h3>
        <p>降伏自我的解脫防護軌道。結合儒家五常（仁義禮智信），設有戒律直覺文字雲、現代物質與精神誘惑投票及「顏回食粥」對比滑桿。</p>
      </div>
      <a href="five-precepts/" class="enter-btn">
        開始放映 <i class="fa-solid fa-chevron-right"></i>
      </a>
    </div>
    
  </div>

  <footer>
    <p>© 2026 佛堂智慧多媒體課堂系統 • 降伏自心 漸修菩提</p>
  </footer>

</body>
</html>
